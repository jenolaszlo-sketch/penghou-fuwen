name: CI

on:
  push:
    branches: [main, codex/fuwen-activity-groups]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-pack:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout Fuwen
        uses: actions/checkout@v6

      - name: Use runner work volume for temporary databases
        run: |
          $temporary = Join-Path $env:RUNNER_TEMP 'activity-groups'
          New-Item -ItemType Directory -Path $temporary -Force | Out-Null
          foreach ($name in @('TEMP', 'TMP', 'TMPDIR')) { "$name=$temporary" >> $env:GITHUB_ENV }

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Verify signed public Zhinu baseline
        run: ./eng/Verify-PublicZhinuBaseline.ps1 -OutputDirectory artifacts/zhinu-public -ReceiptPath artifacts/zhinu-public-baseline.json

      - name: Build
        run: dotnet build Penghou.Fuwen.slnx --configuration Release

      - name: Verify formatting
        run: dotnet format Penghou.Fuwen.slnx --verify-no-changes --no-restore

      - name: Test
        run: dotnet test Penghou.Fuwen.slnx --configuration Release --no-build --no-restore --logger 'trx;LogFilePrefix=full' --blame-hang-timeout 5m --blame-hang-dump-type none --results-directory artifacts/test-results

      - name: Verify independent canonical JSON vector
        run: python tests/golden/canonical_json_v1.py

      - name: Pack
        run: dotnet pack Penghou.Fuwen.slnx --configuration Release --no-build --no-restore --output artifacts --property:PackageVersion=0.0.0-ci.${{ github.run_id }}

      - name: Upload exact candidate closure
        uses: actions/upload-artifact@v6
        with:
          name: nuget-packages-${{ matrix.os }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
            artifacts/zhinu-public-baseline.json
          if-no-files-found: error

      - name: Retain build and public-dependency evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-qualification-${{ matrix.os }}
          path: |
            artifacts/test-results/*.trx
            artifacts/test-results/**/Sequence*.xml
            artifacts/zhinu-public-baseline.json
          if-no-files-found: ignore

  consumer-proof:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: build-test-pack
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use runner work volume for temporary databases
        run: |
          $temporary = Join-Path $env:RUNNER_TEMP 'activity-groups'
          New-Item -ItemType Directory -Path $temporary -Force | Out-Null
          foreach ($name in @('TEMP', 'TMP', 'TMPDIR')) { "$name=$temporary" >> $env:GITHUB_ENV }

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Download canonical Fuwen candidate packages
        uses: actions/download-artifact@v6
        with:
          name: nuget-packages-ubuntu-latest
          path: artifacts

      - name: Verify signed public Zhinu baseline
        run: ./eng/Verify-PublicZhinuBaseline.ps1 -OutputDirectory artifacts/zhinu-public -ReceiptPath artifacts/zhinu-public-baseline.json

      - name: Stage Fuwen candidate feed
        run: |
          New-Item -ItemType Directory -Path artifacts/fuwen-candidate -Force | Out-Null
          Get-ChildItem artifacts -File | Where-Object { $_.Extension -in '.nupkg','.snupkg' } | Copy-Item -Destination artifacts/fuwen-candidate -Force

      - name: Marang and Review consumer proof
        run: |
          $version = '0.0.0-ci.${{ github.run_id }}'
          foreach ($tf in @('net8.0', 'net10.0')) {
            foreach ($project in @('Penghou.Fuwen.MarangConsumer.Tests', 'Penghou.Fuwen.ReviewConsumer.Tests')) {
              $csproj = "tests/$project/$project.csproj"
              dotnet restore $csproj --configfile eng/NuGet.Consumer.config --packages "artifacts/consumer-cache-$tf" -p:TargetFramework=$tf -p:FuwenPackageVersion=$version
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              dotnet build $csproj --configuration Release -f $tf --no-restore -p:FuwenPackageVersion=$version
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              dotnet test $csproj --configuration Release -f $tf --no-build --no-restore -p:FuwenPackageVersion=$version --logger 'trx;LogFilePrefix=consumer' --results-directory artifacts/consumer-results
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }

      - name: Verify isolated public-dependency candidate archives
        run: ./eng/Verify-PublicCandidateConsumers.ps1 -ArtifactsDirectory artifacts -PackageVersion '0.0.0-ci.${{ github.run_id }}' -BaselinePath docs/qualification/activity-groups/zhinu-public-baseline.json -ResultsDirectory artifacts/consumer-results -OutputPath artifacts/consumer-qualification.json

      - name: Verify precompiled public Fuwen consumer and schema boundaries
        run: ./eng/Verify-LegacyFuwenConsumer.ps1 -ArtifactsDirectory artifacts -PackageVersion '0.0.0-ci.${{ github.run_id }}' -ZhinuArtifactsDirectory artifacts/zhinu-public -ZhinuPackageVersion '0.2.0-preview.10' -OutputDirectory artifacts/legacy-fuwen

      - name: Verify consumer formatting
        run: |
          dotnet format tests/Penghou.Fuwen.MarangConsumer.Tests/Penghou.Fuwen.MarangConsumer.Tests.csproj --verify-no-changes --no-restore
          dotnet format tests/Penghou.Fuwen.ReviewConsumer.Tests/Penghou.Fuwen.ReviewConsumer.Tests.csproj --verify-no-changes --no-restore

      - name: Retain consumer qualification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: consumer-qualification-${{ matrix.os }}
          path: |
            artifacts/consumer-results/**/*.trx
            artifacts/consumer-qualification.json
            artifacts/legacy-fuwen/**/qualification.json
            artifacts/legacy-fuwen/**/logs/*.log
            artifacts/zhinu-public-baseline.json
          if-no-files-found: ignore
