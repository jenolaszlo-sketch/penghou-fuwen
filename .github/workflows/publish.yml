name: Publish to NuGet

# ZG-RQ-02 RG-03: the tag-based release path prepares the exclusive native
# candidate feed before any restore. The root NuGet.config maps all seven
# native package IDs exclusively to artifacts/zhinu-candidate; the
# prepare-native-feed job stages exactly the pinned native candidate
# (source commit from docs/qualification/activity-groups/zhinu-candidate.json)
# and verifies it. The validate job consumes the staged feed, performs the
# full validation of the exact tagged commit and uploads the validated
# packages. The publish job consumes only those artifacts, behind the
# protected nuget environment approval. Nothing in this workflow can resolve
# a native dependency outside the approved staged feed.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to validate and publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/release-qualification.yml
    with:
      require-release-tag: true
      release_tag: ${{ inputs.release_tag || '' }}

  publish:
    name: Push validated packages (protected environment)
    needs: validate
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download validated packages
        uses: actions/download-artifact@v7
        with:
          name: release-packages-${{ github.sha }}-ubuntu-latest
          path: artifacts

      - uses: actions/checkout@v6
        with:
          path: verifier-source
          persist-credentials: false

      - name: Reverify every archive before requesting credentials
        shell: pwsh
        run: |
          [xml]$props = Get-Content verifier-source/Directory.Build.props
          ./verifier-source/eng/ReleasePackageSet.ps1 -Mode Verify -Directory artifacts -Version $props.Project.PropertyGroup.Version

      - name: NuGet login (OIDC -> temp API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages to NuGet
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --skip-duplicate

      - name: Push symbols to NuGet
        run: >
          dotnet nuget push ./artifacts/*.snupkg
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --skip-duplicate
