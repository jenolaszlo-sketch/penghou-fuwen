name: Release rehearsal

# ZG-RQ-02 RG-03: nonpublishing hosted rehearsal of the Fuwen release path.
# Runs the exact staged-feed preparation and full validation pipeline of the
# publish workflow (restore from the exclusive mapped feed, build, format,
# tests, canonical vector, pack, package inspection) and then proves
# structurally that no publication step exists in this workflow. It grants no
# publication credentials and never runs a NuGet push.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearse:
    name: Stage feed and validate (no push)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout rehearsal commit
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Read exact native source pin
        id: native-pin
        shell: pwsh
        run: |
          $pin = Get-Content docs/qualification/activity-groups/zhinu-candidate.json -Raw | ConvertFrom-Json
          if ($pin.SourceCommit -notmatch '^[0-9a-f]{40}$') { throw 'Invalid native source pin.' }
          "commit=$($pin.SourceCommit)" >> $env:GITHUB_OUTPUT
          "version=$($pin.Version)" >> $env:GITHUB_OUTPUT

      - name: Checkout pinned native source
        uses: actions/checkout@v6
        with:
          repository: jenolaszlo-sketch/penghou-zhinu
          ref: ${{ steps.native-pin.outputs.commit }}
          path: native-candidate-source

      - name: Prepare exact-source native candidates
        shell: pwsh
        run: |
          ./eng/Prepare-ZhinuSourceCandidate.ps1 -SourceDirectory native-candidate-source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = @(Get-ChildItem artifacts/zhinu-source-candidate/zhinu-source-candidate-*.json)
          if ($manifest.Count -ne 1) { throw 'Expected one native rebuild manifest.' }
          Copy-Item -LiteralPath $manifest[0].FullName -Destination artifacts/zhinu-source-candidate.json

      - name: Verify candidate preparation rejection boundaries
        run: ./eng/Test-ZhinuCandidatePreparation.ps1 -ArtifactsDirectory artifacts/zhinu-candidate -CandidatePinPath artifacts/zhinu-source-candidate.json -OutputDirectory artifacts/candidate-preparation
        shell: pwsh

      - name: Verify staged native feed against the pin
        shell: pwsh
        run: |
          $resolved = (& git -C native-candidate-source rev-parse HEAD).Trim()
          ./eng/Verify-NativeFeed.ps1 `
            -FeedDirectory artifacts/zhinu-candidate `
            -PinPath docs/qualification/activity-groups/zhinu-candidate.json `
            -Version '${{ steps.native-pin.outputs.version }}' `
            -ResolvedSourceCommit $resolved

      - name: Build
        run: dotnet build Penghou.Fuwen.slnx --configuration Release

      - name: Verify formatting
        run: dotnet format Penghou.Fuwen.slnx --verify-no-changes --no-restore

      - name: Test
        run: dotnet test Penghou.Fuwen.slnx --configuration Release --no-build --logger 'trx;LogFilePrefix=rehearsal' --blame-hang-timeout 5m --blame-hang-dump-type none --results-directory artifacts/test-results

      - name: Verify independent canonical JSON vector
        run: python3 tests/golden/canonical_json_v1.py

      - name: Pack and inspect package set
        shell: bash
        run: |
          set -euo pipefail
          for csproj in \
            src/Penghou.Fuwen/Penghou.Fuwen.csproj \
            src/Penghou.Fuwen.Compiler/Penghou.Fuwen.Compiler.csproj \
            src/Penghou.Fuwen.Zhinu/Penghou.Fuwen.Zhinu.csproj \
            src/Penghou.Fuwen.Baize/Penghou.Fuwen.Baize.csproj; do
            dotnet pack "$csproj" \
              --configuration Release \
              --no-build \
              --output ./artifacts/packages \
              --property:PackageVersion=0.0.0-rehearsal.${{ github.run_id }}
          done
          test "$(find artifacts/packages -maxdepth 1 -name '*.nupkg' ! -name '*.snupkg' | wc -l)" -eq 4
          test "$(find artifacts/packages -maxdepth 1 -name '*.snupkg' | wc -l)" -eq 4
          echo "RELEASE-ELIGIBLE: staged feed + full validation passed for $GITHUB_SHA; NO PUSH will occur."

      - name: Structural no-push guard
        shell: bash
        run: |
          set -euo pipefail
          echo "Rehearsal workflow must contain no NuGet push or login:"
          if grep -nE 'nuget push|NuGet/login|NUGET_API_KEY' .github/workflows/release-rehearsal.yml; then
            echo "FAIL: rehearsal workflow reaches publication." >&2; exit 1
          fi
          echo "Publish workflow: push steps must exist only in the publish job:"
          push_lines=$(grep -n 'name: Push packages to NuGet\|name: Push symbols to NuGet\|NuGet login' .github/workflows/publish.yml | cut -d: -f1)
          publish_job_line=$(grep -n '^  publish:' .github/workflows/publish.yml | cut -d: -f1)
          for line in $push_lines; do
            if [ "$line" -lt "$publish_job_line" ]; then
              echo "FAIL: publication step before the publish job." >&2; exit 1
            fi
          done
          grep -q 'needs: validate' .github/workflows/publish.yml
          grep -q 'environment: nuget' .github/workflows/publish.yml
          echo "PASS: publication requires validation + protected environment."

      - name: Retain rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-rehearsal-evidence
          path: |
            artifacts/zhinu-source-candidate.json
            artifacts/candidate-preparation/**
            artifacts/test-results/**
          if-no-files-found: warn
