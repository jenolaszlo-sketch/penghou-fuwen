name: Release rehearsal
on:
  workflow_dispatch:
  push:
    branches: [codex/zg-rq-02-rehearsal]
permissions:
  contents: read
jobs:
  rehearse:
    uses: ./.github/workflows/release-qualification.yml
    with:
      require-release-tag: false

  handoff:
    needs: rehearse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-packages-${{ github.sha }}-ubuntu-latest
          path: artifacts
      - uses: actions/checkout@v6
        with:
          path: verifier-source
          persist-credentials: false

      - name: Reverify every archive before requesting credentials
        shell: pwsh
        run: |
          [xml]$props = Get-Content verifier-source/Directory.Build.props
          ./verifier-source/eng/ReleasePackageSet.ps1 -Mode Verify -Directory artifacts -Version $props.Project.PropertyGroup.Version


  authorization-probe:
    name: Nonpublishing environment checkpoint
    needs: handoff
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
    steps:
      - run: echo 'Manual checkpoint reached. No credentials requested; publication remains unauthorized.'
